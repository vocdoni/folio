# SPDX-License-Identifier: AGPL-3.0-only
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  PANDOC_VERSION: "3.12.1"
  PANDOC_SHA256: "d0c90410e90204c9ca83b8539fac5c7aed01fd537207e4585849f8abc5df20b8"
  TYPST_VERSION: "0.15.1"
  TYPST_SHA256: "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall # built with the job's Go toolchain (the module targets Go 1.27)

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: pinned pandoc and typst
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          curl -fsSL -o pandoc.tar.gz "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          echo "${PANDOC_SHA256}  pandoc.tar.gz" | sha256sum --check -
          tar -xzf pandoc.tar.gz --strip-components=2 "pandoc-${PANDOC_VERSION}/bin/pandoc"
          curl -fsSL -o typst.tar.xz "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "${TYPST_SHA256}  typst.tar.xz" | sha256sum --check -
          tar -xJf typst.tar.xz --strip-components=1 typst-x86_64-unknown-linux-musl/typst
          echo "FOLIO_PANDOC=$RUNNER_TEMP/tools/pandoc" >> "$GITHUB_ENV"
          echo "FOLIO_TYPST=$RUNNER_TEMP/tools/typst" >> "$GITHUB_ENV"
          ./pandoc --version | head -1
          ./typst --version
      - name: go vet
        run: go vet ./...
      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...
      - name: go test (static, covers RLIMIT_AS)
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./internal/sandbox/ ./internal/render/
      - name: build (static)
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o "$RUNNER_TEMP/folio" ./cmd/folio

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  agent-files:
    # Generated Agent Skill must match the guides (no drift); skill frontmatter
    # and the Claude Code plugin manifests must be valid.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go generate drift check
        run: |
          set -euo pipefail
          go generate ./...
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "::error::generated files are stale: run 'go generate ./...' and commit the result"
            exit 1
          fi
      - name: skill and plugin manifest checks
        run: go test -count=1 -run 'Skill|Plugin|Marketplace' ./internal/skill/
      - name: claude plugin validate (when the CLI is available)
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate .
          else
            echo "claude CLI not installed on this runner; the Go manifest checks above cover the manifests"
          fi

  docker:
    # Builds the image (amd64), runs the container smoke test and the golden
    # and e2e tests inside the image with its pandoc and typst.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: folio:ci
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=folio-ci
          cache-to: type=gha,mode=max,scope=folio-ci
      - name: container smoke test
        run: scripts/docker-smoke.sh folio:ci
      - name: golden and e2e tests inside the image
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/testbin"
          mkdir -p "$bin"
          go test -c -trimpath -o "$bin/render.test" ./internal/render
          go test -c -trimpath -o "$bin/e2e.test" ./internal/e2e
          chmod -R a+rX "$bin" .
          docker run --rm -v "$PWD:/src:ro" -v "$bin:/testbin:ro" -w /src/internal/render \
            --entrypoint /testbin/render.test folio:ci -test.run Golden -test.count=1 -test.v
          docker run --rm -v "$PWD:/src:ro" -v "$bin:/testbin:ro" -w /src/internal/e2e \
            --entrypoint /testbin/e2e.test folio:ci -test.count=1 -test.v

  ui:
    # The web UI: locked install, high-severity audit, svelte-check, unit tests, build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: npm audit (high and critical)
        run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test
      - run: npm run build

  ui-e2e:
    # Playwright against the image with a stub OpenRouter (no real model is
    # called): sign in, activity, documents, create, studio, brands; axe-core,
    # console errors, CSP violations and external requests on every screen.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: folio:e2e
          build-args: VERSION=e2e-${{ github.sha }}
          cache-from: type=gha,scope=folio-ci
      - name: end-to-end tests
        run: scripts/ui-e2e.sh folio:e2e
      - name: keep the report and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
